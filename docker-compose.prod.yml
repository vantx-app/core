services:
  # ----------------------------------
  # LANDING PAGE (Next.js Standalone)
  # ----------------------------------
  vantx_landing:
    image: ghcr.io/vantx-app/landing:latest
    container_name: vantx_landing
    networks:
      - vantx-network
    deploy:
      resources:
        limits:
          memory: 200M
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - INTERNAL_API_URL=http://vantx_server:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - vantx_server

  # ----------------------------------
  # DASHBOARD (Next.js Standalone)
  # ----------------------------------
  vantx_dashboard:
    image: ghcr.io/vantx-app/dashboard:latest
    container_name: vantx_dashboard
    networks:
      - vantx-network
    deploy:
      resources:
        limits:
          memory: 200M
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOSTNAME=0.0.0.0
      - INTERNAL_API_URL=http://vantx_server:8000
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      - vantx_server

  # ----------------------------------
  # MARKETPLACE (Next.js Standalone)
  # ----------------------------------
  vantx_marketplace:
    image: ghcr.io/vantx-app/marketplace:latest
    container_name: vantx_marketplace
    networks:
      - vantx-network
    deploy:
      resources:
        limits:
          memory: 200M
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3002
      - HOSTNAME=0.0.0.0
      - CRM_API_URL=http://vantx_server:8000
      - MARKETPLACE_API_URL=http://vantx_marketplace_api:8001
    ports:
      - "127.0.0.1:3002:3002"
    depends_on:
      - vantx_server
      - vantx_marketplace_api

  # ----------------------------------
  # MARKETPLACE API (NestJS API)
  # ----------------------------------
  vantx_marketplace_api:
    image: ghcr.io/vantx-app/marketplace-api:latest
    container_name: vantx_marketplace_api
    networks:
      - vantx-network
    deploy:
      resources:
        limits:
          memory: 300M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=256
      - MARKETPLACE_API_PORT=8001
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      vantx_db:
        condition: service_healthy

  # ----------------------------------
  # BACKEND (NestJS API)
  # ----------------------------------
  vantx_server:
    image: ghcr.io/vantx-app/crm-api:latest
    container_name: vantx_server
    networks:
      - vantx-network
    deploy:
      resources:
        limits:
          memory: 750M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=512
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      vantx_db:
        condition: service_healthy

  # ----------------------------------
  # TELEMETRY TCP INGESTOR (Teltonika listener)
  # ----------------------------------
  vantx_ingestor:
    image: ghcr.io/vantx-app/telemetry-ingestor:latest
    container_name: vantx_ingestor
    networks:
      - vantx-network
    deploy:
      resources:
        limits:
          memory: 500M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - INGESTOR_PORT=9000
      - INGESTOR_HOST=0.0.0.0
      - API_HOST=vantx_server
    ports:
      - "0.0.0.0:9000:9000"
    depends_on:
      vantx_db:
        condition: service_healthy

  # ----------------------------------
  # BASE DE DATOS (PostgreSQL 17)
  # ----------------------------------
  vantx_db:
    image: postgres:17-alpine
    container_name: vantx_db
    networks:
      - vantx-network
    deploy:
      resources:
        limits:
          memory: 400M
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - vantx_prod_db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${DB_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------
  # AUTOMATED DB BACKUPS (pg_dump cron)
  # ----------------------------------
  # Runs pg_dump every 24 h, keeps the last 7 days.
  # Backups land in ./backups on the host (bind-mount).
  # ----------------------------------
  vantx_backup:
    image: postgres:17-alpine
    container_name: vantx_backup
    networks:
      - vantx-network
    deploy:
      resources:
        limits:
          memory: 128M
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PGHOST=vantx_db
      - PGUSER=${DB_USER}
      - PGPASSWORD=${DB_PASSWORD}
      - PGDATABASE=${DB_NAME}
      - BACKUP_RETENTION_DAYS=7
      - BACKUP_INTERVAL_SECONDS=86400
    volumes:
      - ./backups:/backups
    depends_on:
      vantx_db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "🗄️  VantX DB Backup service started"
        echo "    Interval: $${BACKUP_INTERVAL_SECONDS}s | Retention: $${BACKUP_RETENTION_DAYS} days"
        while true; do
          STAMP=$$(date +%Y-%m-%d_%H-%M-%S)
          FILE="/backups/$${PGDATABASE}_$${STAMP}.sql.gz"
          echo "⏳ [$${STAMP}] Starting backup..."
          pg_dump -Fc | gzip > "$$FILE"
          if [ $$? -eq 0 ]; then
            SIZE=$$(du -h "$$FILE" | cut -f1)
            echo "✅ [$${STAMP}] Backup complete: $$FILE ($$SIZE)"
          else
            echo "❌ [$${STAMP}] Backup FAILED"
          fi
          # Prune old backups
          find /backups -name "*.sql.gz" -mtime +$${BACKUP_RETENTION_DAYS} -delete
          PRUNED=$$(find /backups -name "*.sql.gz" | wc -l)
          echo "🧹 [$${STAMP}] Retained backups: $$PRUNED"
          sleep $${BACKUP_INTERVAL_SECONDS}
        done

volumes:
  vantx_prod_db_data:
    external: true
    name: vantx_vantx_prod_db_data

networks:
  vantx-network:
    driver: bridge
