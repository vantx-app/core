version: '3.8'
services:
  # ----------------------------------
  # CRM BACKEND API (NestJS)
  # ----------------------------------
  vantx_server:
    build:
      context: ../../
      dockerfile: apps/crm-api/Dockerfile
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - NODE_ENV=development
      - API_PORT=${API_PORT:-8000}
    ports:
      - '${API_PORT:-8000}:${API_PORT:-8000}'
      - '5555:5555' # Prisma Studio
    volumes:
      - ../../:/app
      - /app/node_modules
      - /app/apps/crm-api/node_modules
      - /app/packages/database/node_modules
      - /app/packages/auth/node_modules
    depends_on:
      vantx_db:
        condition: service_healthy

  # ----------------------------------
  # TELEMETRY TCP INGESTOR (Teltonika listener)
  # ----------------------------------
  vantx_ingestor:
    build:
      context: ../../
      dockerfile: apps/telemetry-ingestor/Dockerfile
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - INGESTOR_PORT=${INGESTOR_PORT:-9000}
      - INGESTOR_HOST=0.0.0.0
    ports:
      - '${INGESTOR_PORT:-9000}:${INGESTOR_PORT:-9000}'
    volumes:
      - ../../:/app
      - /app/node_modules
      - /app/apps/telemetry-ingestor/node_modules
      - /app/packages/database/node_modules
      - /app/packages/telemetry-parser/node_modules
    depends_on:
      vantx_db:
        condition: service_healthy

  # ----------------------------------
  # POSTGRES DATABASE
  # ----------------------------------
  vantx_db:
    image: postgres:17-alpine
    restart: always
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_USER}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - '${DB_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------
  # PGADMIN
  # ----------------------------------
  pgadmin:
    image: dpage/pgadmin4
    deploy:
      resources:
        limits:
          memory: 256M
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=pgadmin4
    ports:
      - '5050:80'
    depends_on:
      - vantx_db

  # ----------------------------------
  # VALHALLA ROUTING ENGINE (OSM Panama)
  # ----------------------------------
  vantx_valhalla:
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:latest
    environment:
      - tile_urls=https://download.geofabrik.de/central-america/panama-latest.osm.pbf
      - tile_extract_url=https://download.geofabrik.de/central-america/panama-latest.osm.pbf
      - build_elevation=false
      - build_admins=true
      - build_time_zones=false
      - use_tiles_ignore_pbf=false
    volumes:
      - valhalla-data:/custom_files

volumes:
  db-data:
  valhalla-data:
